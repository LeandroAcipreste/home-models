<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=TASA+Orbiter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      href="/images/video/frame_00001.webp"
      fetchpriority="high"
    />
    <title>Site Home Model</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        } catch (e) {}
        function toTop() {
          window.scrollTo(0, 0);
          if (document.documentElement) document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        }
        toTop();
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", toTop, { once: true });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
